name: Lint

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.78.0
          manifest-path: pyproject.toml
          run-install: false
      - name: Resolve development environments
        env:
          # Resolve the CUDA environments on this CPU-only runner.
          CONDA_OVERRIDE_CUDA: "13"
        run: pixi lock
      - name: Lint
        run: pixi run --locked lint
      - name: Check formatting
        run: pixi run --locked format-check
      - name: Type check
        run: pixi run --locked typecheck
