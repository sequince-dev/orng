name: Tests

on:
  push:
    branches: [ main, release* ]
  pull_request:
    branches: [ main, release* ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-pixi-lock:
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.pixi-lock.outputs.cache-key }}
      pixi-version: ${{ steps.pixi-lock.outputs.pixi-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: xarray-contrib/pixi-lock/create-and-cache@1cf6af9f0f4075f75c491fcabb7daa379e7e18be
        id: pixi-lock
        env:
          # Resolve CUDA environments on a CPU runner; tests use real hardware detection.
          CONDA_OVERRIDE_CUDA: "13"
        with:
          pixi-version: v0.78.0
          manifest-path: pyproject.toml
          hash-files: pyproject.toml
      - uses: actions/upload-artifact@v6
        with:
          name: pixi-lock
          path: pixi.lock
          if-no-files-found: error

  tests:
    name: Pixi ${{ matrix.environment }}
    needs: cache-pixi-lock

    strategy:
      fail-fast: false
      matrix:
        environment: [ci-py310, ci-py311, ci-py312, all-backends]
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v7
    - uses: xarray-contrib/pixi-lock/restore@1cf6af9f0f4075f75c491fcabb7daa379e7e18be
      with:
        cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
        manifest-path: pyproject.toml
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
        manifest-path: pyproject.toml
        run-install: false
    - name: Test with pytest
      run: pixi run --locked -e ${{ matrix.environment }} test

  cupy-api:
    name: CuPy ${{ matrix.cupy-version }} API (CPU stub build)
    needs: cache-pixi-lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cupy-version: ["12.*", "13.*", "14.*"]
    env:
      CUPY_VERSION: ${{ matrix.cupy-version }}
      CUPY_INSTALL_USE_STUB: "1"
      # Compatibility for CuPy 12; remove when support for 12 is dropped.
      READTHEDOCS: "True"
      CUPY_NUM_BUILD_JOBS: "2"
    steps:
    - uses: actions/checkout@v7
    - uses: xarray-contrib/pixi-lock/restore@1cf6af9f0f4075f75c491fcabb7daa379e7e18be
      with:
        cache-key: ${{ needs.cache-pixi-lock.outputs.cache-key }}
        manifest-path: pyproject.toml
    - uses: prefix-dev/setup-pixi@v0.10.0
      with:
        pixi-version: ${{ needs.cache-pixi-lock.outputs.pixi-version }}
        manifest-path: pyproject.toml
        run-install: false
    # Build the stub inside Pixi's Python environment. Keep installation and
    # execution together so a later Pixi sync cannot remove the stub package.
    - name: Build CuPy stub and test the NumPy wrapper
      run: |
        pixi run --locked -e cupy-api bash -euo pipefail <<'SH'
        python -m pip install --no-binary=cupy "cupy==$CUPY_VERSION"
        python -c "import cupy; assert callable(cupy.random.Generator.random)"
        python -m pytest -q tests/test_backends.py tests/test_functional_backends.py --fake-cupy -k cupy
        SH
